# Copy to /etc/nginx/sites-available/carbon-silicon, replace example.com there, then link it into sites-enabled.
# (Copy rather than link, so git pull never conflicts with your edits. See deploy/README.md.)
server {
    listen 80;
    server_name example.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # nginx >= 1.25.1: http2 is a separate directive. On older nginx, use `listen 443 ssl http2;` instead.
    listen 443 ssl;
    http2 on;
    server_name example.com;
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json text/markdown image/svg+xml;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Long-polls hold for up to 30 s.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_read_timeout 45s;
        proxy_buffering off;
    }

    # A location that sets any proxy_set_header inherits none from above, so repeat them here.
    location = /ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
